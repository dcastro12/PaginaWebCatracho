<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <!-- Background (placeholder) -->
  <rect width="1440" height="900" fill="#0a0c12"/>
  <rect width="1440" height="900" fill="#000" opacity="0.35"/>

  <!-- Modal -->
  <rect x="310" y="120" width="820" height="660" rx="22" fill="#0b0f18" opacity="0.96" stroke="#8792a6" stroke-width="1.6"/>
  <rect x="312" y="122" width="816" height="656" rx="21" fill="none" stroke="#1da1ff" stroke-width="1" opacity="0.12"/>

  <!-- Close -->
  <rect x="1070" y="138" width="44" height="44" rx="22" fill="#0a0d14" stroke="#7a8396" stroke-width="1.5"/>
  <line x1="1084" y1="152" x2="1100" y2="168" stroke="#d9dee8" stroke-width="2"/>
  <line x1="1100" y1="152" x2="1084" y2="168" stroke="#d9dee8" stroke-width="2"/>

  <!-- Title -->
  <text x="354" y="186" fill="#e8edf6" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="3">REQUISITOS</text>
  <line x1="354" y1="200" x2="500" y2="200" stroke="#e8edf6" stroke-width="1.3" opacity="0.75"/>

  <!-- Section: Codigo de aduana -->
  <text x="720" y="244" fill="#b7c2d6" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2" text-anchor="middle">CÓDIGO DE ADUANA:</text>
  <line x1="354" y1="262" x2="1086" y2="262" stroke="#2a3342" stroke-width="1"/>

  <!-- Download cards (2 cols) -->
  <rect x="354" y="282" width="360" height="78" rx="14" fill="#0b1220" opacity="0.90" stroke="#4a5568" stroke-width="1.3"/>
  <text x="372" y="306" fill="#b7c2d6" font-family="Inter, Arial, sans-serif" font-size="12">Requisitos para código de aduana:</text>
  <text x="372" y="328" fill="#e8edf6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Comerciante Individual</text>
  <rect x="574" y="304" width="120" height="34" rx="18" fill="#1da1ff"/>
  <text x="634" y="326" fill="#08101a" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900" text-anchor="middle">Descargar</text>

  <rect x="736" y="282" width="360" height="78" rx="14" fill="#0b1220" opacity="0.90" stroke="#4a5568" stroke-width="1.3"/>
  <text x="754" y="306" fill="#b7c2d6" font-family="Inter, Arial, sans-serif" font-size="12">Requisitos para código de aduana:</text>
  <text x="754" y="328" fill="#e8edf6" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800">Sociedad Mercantil</text>
  <rect x="956" y="304" width="120" height="34" rx="18" fill="#1da1ff"/>
  <text x="1016" y="326" fill="#08101a" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900" text-anchor="middle">Descargar</text>

  <!-- Section: Incorporacion -->
  <text x="720" y="422" fill="#b7c2d6" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2" text-anchor="middle">INCORPORACIÓN A CATRACHO</text>
  <line x1="354" y1="440" x2="1086" y2="440" stroke="#2a3342" stroke-width="1"/>

  <!-- List area (scroll) -->
  <rect x="354" y="460" width="732" height="260" rx="16" fill="#0a0d14" stroke="#3b465a" stroke-width="1.2"/>
  <!-- Scrollbar -->
  <rect x="1072" y="476" width="6" height="228" rx="3" fill="#111827" opacity="0.9"/>
  <rect x="1072" y="506" width="6" height="84" rx="3" fill="#d9dee8" opacity="0.7"/>

  <!-- Items -->
  <g fill="#c7d0e2" font-family="Inter, Arial, sans-serif" font-size="12">
    <text x="372" y="494" font-weight="900" fill="#cdd6e6">1.</text><text x="394" y="494">Copia de escritura de constitución (comerciante individual o sociedad).</text>
    <text x="372" y="522" font-weight="900" fill="#cdd6e6">2.</text><text x="394" y="522">Copia del certificado de operación y permiso de explotación.</text>
    <text x="372" y="550" font-weight="900" fill="#cdd6e6">3.</text><text x="394" y="550">Copia de la boleta de revisión de los vehículos.</text>
    <text x="372" y="578" font-weight="900" fill="#cdd6e6">4.</text><text x="394" y="578">Copia de identidad + RTN representante + RTN empresa.</text>
    <text x="372" y="606" font-weight="900" fill="#cdd6e6">5.</text><text x="394" y="606">Copia de identidad + licencia de conducir del motorista.</text>
    <text x="372" y="634" font-weight="900" fill="#cdd6e6">6.</text><text x="394" y="634">Copia de recibo de servicios: Hondutel / ENEE / SANAA.</text>
  </g>

  <line x1="354" y1="726" x2="1086" y2="726" stroke="#2a3342" stroke-width="1"/>
  <text x="354" y="756" fill="#7f8aa0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600">Hover/focus: botones con aclarado + outline azul</text>
  <text x="1086" y="756" fill="#7f8aa0" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="end">DESKTOP — A</text>
</svg>
