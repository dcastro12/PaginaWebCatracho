name: Update precios (dólar + diésel)

on:
  schedule:
    - cron: '7 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.BOT_PUSH_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # Exits 0 whenever something publishable was written (even if degraded), so
      # the commit step below still runs. Do NOT make a degraded run exit non-zero
      # here: that would skip the commit and discard the good value.
      - name: Run scraper
        id: scrape
        env:
          PRECIOS_OVERRIDE: ${{ vars.PRECIOS_OVERRIDE }}
        run: node scripts/update-precios.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain src/content/datasets/information.ts)" ]]; then
            git config user.name  "catracho-bot"
            git config user.email "bot@catrachohn.com"
            git add src/content/datasets/information.ts
            git commit -m "chore(precios): actualización automática diaria"
            git push
          else
            echo "Sin cambios."
          fi

      # Last step on purpose: the commit above has already published what passed.
      # Fails the job (red) only when the run was degraded. Advisory-only runs
      # do not set `degraded`, so they stay green.
      - name: Report degraded
        if: steps.scrape.outputs.degraded == 'true'
        env:
          DEGRADED_REASON: ${{ steps.scrape.outputs.degraded_reason }}
        run: |
          echo "Run degraded: $DEGRADED_REASON"
          exit 1
