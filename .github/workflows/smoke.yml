name: Smoke test (live site)

on:
  schedule:
    # Every 4 hours. This is the LOAD-BEARING trigger: the 2026-09-21 outage
    # happened because deploys had stopped firing entirely, so a hook that
    # only runs after a publish would never have caught it. This asks
    # "is the site healthy right now?" independently of deploy activity.
    - cron: '17 */4 * * *'
  workflow_dispatch:

# A `workflow_run` trigger on the deploy workflow was tried here and removed:
# it never fired across three completed deploy runs, with every documented
# precondition satisfied (same repo, workflow on the default branch, names
# byte-identical, human `push` and `workflow_dispatch` actors, no skipped
# runs recorded). The post-deploy check now lives as a step inside
# deploy.yml instead, which is also the better design: it runs in the same
# job that just published, with no cross-workflow coupling.

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run smoke check
        run: node scripts/smoke-deploy.mjs
